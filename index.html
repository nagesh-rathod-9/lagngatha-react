    <!-- ================= SEARCH CONSOLE VERIFICATION =================
         Step 1 of getting "insights": Go to search.google.com/search-console,
         add your property as a "URL prefix" (https://www.lagngatha.in/),
         choose the "HTML tag" verification method, and Google will give you
         a content value to paste below. Once verified, Search Console shows
         you: which keywords you rank for, impressions, clicks, average
         position, and any indexing errors — free, no code beyond this tag. -->
    <meta name="google-site-verification" content="PASTE_YOUR_VERIFICATION_CODE_HERE" />

    <!-- ================= GOOGLE ANALYTICS (GA4) =================
         Step 2: Go to analytics.google.com → Admin → create a Property for
         lagngatha.in → Data Streams → add a Web stream → copy the
         "Measurement ID" (looks like G-XXXXXXXXXX) and replace it in BOTH
         places below. This shows you: how many visitors, which pages they
         viewed, their city/device, how long they stayed, and which button
         (Enquire, WhatsApp, etc.) they clicked, if you set up event
         tracking later. Insights show up in the GA4 dashboard within a
         few hours of your first visitor. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-N82GJ9NPEG"></script>

      function gtag() {

    </script>
